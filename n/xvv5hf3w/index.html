<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Todo — San Miguel de Allende</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2A2D; --paper:#FBF4EA; --terra:#B5472A; --terra-deep:#8f3620;
  --sun:#E8A33D; --agave:#42624b; --muted:#6f6a5e; --line:#e9dccb;
  --cantera:#F0C9B6; --noche:#0E2A2D; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:'Fraunces',Georgia,serif;color:var(--ink)}
.sans{font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif}

#deck{height:100dvh;width:100vw;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:max(env(safe-area-inset-top),20px) 28px calc(env(safe-area-inset-bottom) + 74px);
  display:flex;flex-direction:column;justify-content:center;background:var(--paper);
  transform:translateX(100%);transition:transform .38s cubic-bezier(.22,.9,.3,1);overflow-y:auto}
.slide.active{transform:translateX(0)}
.slide.prev{transform:translateX(-100%)}

/* nav chrome */
#dots{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;gap:7px;justify-content:center;z-index:50}
.navarrow{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:55;width:40px;height:40px;border-radius:50%;
  border:1.5px solid rgba(14,42,45,.25);background:rgba(251,244,234,.92);color:#B5472A;
  font-size:24px;line-height:1;font-family:'Figtree',sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 0 3px;
  box-shadow:0 3px 10px rgba(14,42,45,.18);backdrop-filter:blur(4px)}
#navL{left:16px}
#navR{right:16px}
.navarrow:active{transform:scale(.92)}
.navarrow[disabled]{opacity:.3;pointer-events:none}
#dots span{width:7px;height:7px;border-radius:50%;background:rgba(34,28,22,.18);transition:all .25s}
#dots span.on{background:var(--terra);width:20px;border-radius:4px}
#lang{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:60;
  font-size:12px;font-weight:700;letter-spacing:.06em;border:1.5px solid var(--ink);
  background:rgba(251,244,234,.85);color:#0E2A2D;border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(4px)}


/* typography */
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:14px}
h1{font-size:clamp(40px,11vw,64px);line-height:1.02;font-weight:400}
h2{font-size:clamp(27px,7.4vw,40px);line-height:1.08;font-weight:600;letter-spacing:-0.04em;margin-bottom:14px}
.lead{font-size:clamp(16px,4.4vw,19px);line-height:1.5;color:var(--muted);margin-top:14px}
.lead b,.lead strong{color:var(--ink)}
em{font-style:italic}

/* slide 1 cover */
.s-cover{background:var(--terra);color:var(--paper);text-align:left}
.s-cover .kicker{color:var(--sun)}
.logo-svg{width:min(72vw,300px);margin:6px 0 2px}
.logo-svg svg{width:100%;height:auto;display:block}
.s-cover .lead{color:rgba(251,244,234,.9);font-size:clamp(18px,5vw,22px)}
.cover-pill{display:inline-block;margin-top:26px;border:1.5px solid rgba(251,244,234,.55);color:var(--paper);border-radius:999px;
  padding:9px 18px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}

/* slide 2 problems */
.s2head{font-size:clamp(18px,5vw,25px);line-height:1.25;margin-bottom:14px}
.probs{margin-top:6px;display:flex;flex-direction:column;gap:13px}
.prob .neq{font-family:'Figtree',sans-serif;font-weight:800;font-size:15.5px;color:var(--terra)}
.prob .neq .n{color:var(--sun);margin-right:7px}
.prob p{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.kick-line{font-style:italic;color:var(--terra-deep);font-size:15px;margin:2px 0 -4px}
/* slide 2 problem (legacy) */
.bigq{font-size:clamp(30px,8.6vw,46px);line-height:1.12}
.bigq .hl{background:linear-gradient(transparent 62%, var(--sun) 62%)}
.gripe{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.gripe p{font-size:15px;line-height:1.55;color:var(--muted);margin-bottom:12px}
.gripe p b{color:var(--ink)}

/* slide 3 pillars */
.pillars{display:flex;flex-direction:column;gap:0;margin-top:8px;border-top:1px solid var(--line)}
.pillar{display:flex;align-items:baseline;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.pillar .n{font-size:14px;color:var(--terra);font-weight:700;min-width:24px}
.pillar h3{font-size:clamp(21px,5.8vw,27px);font-weight:400}
.pillar p{font-size:14px;color:var(--muted);line-height:1.45;margin-top:4px}
.eq{margin-top:18px;font-size:15px;color:var(--terra-deep);font-style:italic}

/* slide 4 phones */
.preview-scroll{position:relative;z-index:45;margin:14px auto 0;width:min(66vw,264px);height:calc(100dvh - 320px);min-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px;box-shadow:0 14px 32px rgba(14,42,45,.3);border:1px solid rgba(14,42,45,.1);padding-right:14px;background:#fff}
.preview-img{width:100%;height:auto;display:block;border-radius:22px 0 0 22px}
.preview-scroll::-webkit-scrollbar{width:5px}
.preview-scroll::-webkit-scrollbar-thumb{background:rgba(181,71,42,.45);border-radius:3px}
.preview-scroll::-webkit-scrollbar-track{background:transparent}
.pv-hint{color:var(--terra);font-size:11px;letter-spacing:.05em}
.s-screen{background:var(--noche);padding:0;display:block;overflow:hidden}
.screen-cap{color:rgba(251,244,234,.9);font-size:13.5px;text-align:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;letter-spacing:.02em;background:var(--noche);position:relative;z-index:2}
.screen-scroll{position:relative;z-index:45;height:calc(100dvh - 118px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px 0}
.screen-scroll::-webkit-scrollbar{width:5px}
.screen-scroll::-webkit-scrollbar-thumb{background:rgba(251,244,234,.4);border-radius:3px}
.screen-scroll::-webkit-scrollbar-track{background:transparent}
.fullphone{width:min(76vw,320px);height:auto;border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.5);display:block;margin:0 auto}
.scroll-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 66px);left:0;right:0;text-align:center;color:rgba(251,244,234,.55);font-size:11px;letter-spacing:.08em;z-index:2;pointer-events:none}
.phones{display:flex;gap:14px;overflow-x:auto;padding:16px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.phone-r{flex:0 0 210px;scroll-snap-align:center}
.phone-r img{width:100%;border-radius:22px;box-shadow:0 12px 28px rgba(14,42,45,.28);border:1px solid rgba(14,42,45,.08);display:block}
.phone{flex:0 0 200px;scroll-snap-align:center;background:var(--ink);border-radius:26px;padding:8px;box-shadow:0 12px 28px rgba(34,28,22,.25)}
.screen{background:#fff;border-radius:19px;overflow:hidden;height:388px;display:flex;flex-direction:column;font-family:-apple-system,sans-serif}
.appbar{background:var(--terra);color:#fff;padding:11px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.appbar .t .dot{color:var(--sun)}
/* map screen */
.mapv{flex:1;position:relative;background:linear-gradient(160deg,#efe9db 0%,#e6dfd0 55%,#dfe4d6 100%)}
.street{position:absolute;background:#fff;opacity:.85}
.pin{position:absolute;width:26px;height:26px;background:var(--terra);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.pin i{transform:rotate(45deg);color:#fff;font-style:normal;font-size:11px;font-weight:800}
.pin.you{background:var(--agave);width:32px;height:32px}
.mapcard{position:absolute;bottom:10px;left:9px;right:9px;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.mapcard b{font-size:13px;display:block}
.mapcard span{font-size:11px;color:#888}
.badge{display:inline-block;background:var(--sun);color:var(--ink);font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;margin-top:5px}
/* profile screen */
.hero-ph{height:96px;background:linear-gradient(135deg,var(--agave),#5d8266);position:relative}
.hero-ph .disc{position:absolute;bottom:-15px;right:12px;background:var(--sun);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.prof{padding:22px 13px 10px}
.prof b{font-size:15px;display:block}
.prof .cat{font-size:11px;color:#999}
.prof .row{display:flex;gap:7px;margin-top:10px}
.chip{background:#f2ede3;border-radius:7px;font-size:10.5px;padding:5px 9px;color:#555;font-weight:600}
.cta-row{margin:12px 13px 0;display:flex;gap:8px}
.cta-row div{flex:1;text-align:center;border-radius:9px;padding:9px 0;font-size:12px;font-weight:700}
.cta-go{background:var(--terra);color:#fff}
.cta-wa{border:1.5px solid var(--line);color:var(--ink)}
.evrow{margin:12px 13px;border-top:1px solid #eee;padding-top:9px}
.evrow span{font-size:10px;color:var(--terra);font-weight:800;letter-spacing:.08em}
.evrow p{font-size:12px;margin-top:3px}
/* events screen */
.evfilter{display:flex;gap:6px;padding:10px 11px 4px;overflow:hidden}
.evfilter .chip.on{background:var(--terra);color:#fff}
.evlist{padding:8px 11px;display:flex;flex-direction:column;gap:8px}
.evcard{border:1px solid #eee;border-radius:11px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.evdate{background:var(--paper);border-radius:8px;text-align:center;padding:5px 9px;min-width:42px}
.evdate b{font-size:15px;display:block;color:var(--terra)}
.evdate span{font-size:9px;letter-spacing:.06em;color:#999;font-weight:700}
.evcard .in b{font-size:12px;display:block}
.evcard .in span{font-size:10.5px;color:#999}
.phone-cap{text-align:center;font-size:11.5px;color:var(--muted);margin-top:9px;font-family:-apple-system,sans-serif;letter-spacing:.02em}
.swipe-hint{text-align:center;font-size:11px;color:var(--terra);margin-top:6px;font-family:-apple-system,sans-serif}

/* slide 5 compare */
.cmp{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-family:-apple-system,sans-serif}
.cmp .row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;font-size:12px;align-items:stretch}
.cmp .row>div{padding:10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center}
.cmp .row>div:first-child{justify-content:flex-start;text-align:left;font-weight:600;background:#fdfaf4}
.cmp .head>div{font-size:11px;font-weight:800;letter-spacing:.04em;background:#f4eee2!important;color:var(--muted)}
.cmp .head .todo-col{background:var(--terra)!important;color:#fff}
.cmp .yes{color:var(--agave);font-weight:800}
.cmp .no{color:#c9c0b2;font-weight:700}
.cmp .row:last-child>div{border-bottom:none}
.cmp-note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}

/* slide 6 offer */
.offer{margin-top:6px;display:flex;flex-direction:column;gap:12px}
.off{display:flex;gap:13px;align-items:flex-start}
.off .tick{width:24px;height:24px;border-radius:50%;background:var(--agave);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;margin-top:2px;font-family:-apple-system,sans-serif}
.off b{font-size:16.5px;display:block;font-weight:600}
.off p{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.founder{margin-top:18px;background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px}
.founder b{color:var(--sun);letter-spacing:.14em;font-size:11px;text-transform:uppercase;font-family:-apple-system,sans-serif}
.founder p{font-size:15px;line-height:1.5;margin-top:6px}

/* slide 7 cost */
.ask{margin-top:8px}
.ask .item{border-left:3px solid var(--terra);padding:4px 0 4px 16px;margin-bottom:18px}
.ask .item b{font-size:18px;font-weight:600;display:block}
.ask .item p{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.45}
.zero{font-size:clamp(50px,15vw,84px);color:var(--terra);line-height:1;margin:6px 0 2px}
.item-flex{display:flex;gap:14px;align-items:center}
.item-flex>div:first-child{flex:1}
.decal-sm{width:86px;flex-shrink:0}
.decal-sm img{filter:drop-shadow(0 5px 12px rgba(14,42,45,.2))}
.draft{display:inline-block;background:#f4eee2;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 9px;color:var(--muted);text-transform:uppercase;font-family:-apple-system,sans-serif;margin-bottom:10px}

/* slide 8 close */
.s-close{background:var(--ink);color:var(--paper)}
.s-close .kicker{color:var(--sun)}
.s-close h2{color:var(--paper)}
.s-close .lead{color:rgba(250,245,236,.75)}
.wa{margin-top:26px;background:#25D366;color:#fff;border-radius:999px;padding:15px 26px;font-size:16.5px;font-weight:700;text-align:center;font-family:-apple-system,sans-serif;box-shadow:0 8px 22px rgba(37,211,102,.35)}
.close-names{margin-top:22px;font-size:14px;color:rgba(250,245,236,.6);text-align:center;font-family:-apple-system,sans-serif}
.close-logo-svg{width:min(52vw,220px);margin-bottom:14px}
.close-logo-svg svg{width:100%;height:auto;display:block}
</style>
</head>

<div id="deck"></div>
<button id="navL" class="navarrow" aria-label="Previous">&#8249;</button>
<div id="dots"></div>
<button id="navR" class="navarrow" aria-label="Next">&#8250;</button>

let lang = 'es';
function T(k){ return S[lang][k]; }

function render(){
 const d = document.getElementById('deck');
 const probsHtml = T('probs').map(p =>
   `<div class="prob"><div class="neq"><span class="n">${p[0]}</span>${p[1]}</div><p class="sans">${p[2]}</p></div>`).join('');
 const p4 = T('prob4');
 const phonesHtml = ['map','venue','menu','list','pass'].map((k,i) =>
   `<div class="phone-r"><img src="${IMG[k]}" alt=""><p class="phone-cap">${T('caps')[i]}</p></div>`).join('');
 d.innerHTML = `
 <section class="slide s-cover">
   <div class="kicker sans">${T('s1k')}</div>
   <div class="logo-svg">${WM_PRIMARY}</div>
   <p class="lead">${T('s1lead')}</p>
   <span class="cover-pill sans">${T('s1pill')}</span>
 </section>

 <section class="slide">
   <div class="kicker sans">${T('s2k')}</div>
   <p class="s2head">${T('s2h')}</p>
   <div class="probs">${probsHtml}</div>
   <p class="kick-line">${T('kick')}</p>
   <div class="probs"><div class="prob"><div class="neq"><span class="n">${p4[0]}</span>${p4[1]}</div><p class="sans">${p4[2]}</p></div></div>
 </section>

 <section class="slide">
   <div class="kicker sans">${T('s3k')}</div>
   <h2>${T('s3h')}</h2>
   <div class="pillars">
     <div class="pillar"><span class="n sans">01</span><div><h3>${T('p1')}</h3><p class="sans">${T('p1d')}</p></div></div>
     <div class="pillar"><span class="n sans">02</span><div><h3>${T('p2')}</h3><p class="sans">${T('p2d')}</p></div></div>
     <div class="pillar"><span class="n sans">03</span><div><h3>${T('p3')}</h3><p class="sans">${T('p3d')}</p></div></div>
   </div>
   <p class="eq">${T('s3eq')}</p>
 </section>

 <section class="slide">
   <div class="kicker sans">${T('s4k')}</div>
   <h2>${T('s4h')}</h2>
   <div class="preview-scroll"><img class="preview-img" src="${IMG.venue}" alt=""></div>
   <p class="phone-cap">${T('caps')[1]} — <span class="pv-hint">${T('scrollhint')}</span></p>
 </section>

 ${['map','venue','menu','list','pass'].map((k,i)=>{
   const tall = (k==='venue'||k==='menu'||k==='list');
   return `
 <section class="slide s-screen">
   <p class="screen-cap sans">${T('caps')[i]}</p>
   <div class="screen-scroll"><img class="fullphone" src="${IMG[k]}" alt=""></div>
   ${tall ? `<div class="scroll-hint sans">${T('scrollhint')}</div>` : ''}
 </section>`;}).join('')}

 <section class="slide">
   <span class="draft">${T('draft')}</span>
   <div class="kicker sans">${T('s7k')}</div>
   <h2>${T('s7h')}</h2>

     <div class="item"><b>${T('a1')}</b><p class="sans">${T('a1d')}</p></div>

   <div class="kicker sans">${T('s8k')}</div>
   <h2>${T('s8h')}</h2>

   <div class="wa">${T('wa')}</div>
   <p class="close-names">${T('names')}</p>
 </section>`;
 buildDots();
 show(cur);
}

let cur = 0;
function slides(){ return document.querySelectorAll('.slide'); }
function buildDots(){
 const dd = document.getElementById('dots');
 dd.innerHTML = '';
 slides().forEach((_,i)=>{ const s=document.createElement('span'); dd.appendChild(s); });
}
function show(i){
 const ss = slides();
 cur = Math.max(0, Math.min(ss.length-1, i));
 ss.forEach((s,j)=>{ s.classList.toggle('active', j===cur); s.classList.toggle('prev', j<cur); });
 document.querySelectorAll('#dots span').forEach((d,j)=>d.classList.toggle('on', j===cur));
 const L=document.getElementById('navL'), R=document.getElementById('navR');
 if(L){ L.toggleAttribute('disabled', cur===0); R.toggleAttribute('disabled', cur===ss.length-1); }
 try{ localStorage.setItem('todo-deck-slide', cur); }catch(e){}
}
function toggleLang(e){
 e.stopPropagation();
 lang = lang==='es' ? 'en' : 'es';
 document.getElementById('lang').textContent = lang==='es' ? 'EN' : 'ES';
 render();
}
document.addEventListener('click', e=>{
 if(e.target.closest('.preview-scroll,.screen-scroll,.phones,#lang,#dots,.navarrow')) return;
 const x = e.clientX / window.innerWidth;
 x < 0.34 ? show(cur-1) : show(cur+1);
});
document.getElementById('navL').addEventListener('click', ()=>show(cur-1));
document.getElementById('navR').addEventListener('click', ()=>show(cur+1));
document.addEventListener('keydown', e=>{
 if(e.key==='ArrowRight'||e.key===' ') show(cur+1);
 if(e.key==='ArrowLeft') show(cur-1);
});
let tx=null, ty=null;
document.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
 if(tx===null) return;
 const dx = e.changedTouches[0].clientX - tx;
 const dy = e.changedTouches[0].clientY - ty;
 const inPhones = e.target.closest('.phones,.preview-scroll,.screen-scroll');
 if(!inPhones && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){ dx<0 ? show(cur+1) : show(cur-1); }
 tx = null; ty = null;
}, {passive:true});
try{ cur = parseInt(localStorage.getItem('todo-deck-slide')||'0')||0; }catch(e){}
const hm = location.hash.match(/^#s(\d+)$/); if(hm) cur = parseInt(hm[1]);
if(cur > 10) cur = 0;
render();
</script>
</body>
</html>
